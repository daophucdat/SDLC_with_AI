# L0 quality gates (Day 5, ADR-19). Every job must finish in < 10 minutes (except the full-stack E2E).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  traceability:
    # every commit has a Conventional Commits subject + US/EN/REL/BR code; docs/traceability.md matches the code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install pytest && python -m pytest -q scripts
      - name: Commits carry a requirement code
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          case "$RANGE" in 0000000000000000000000000000000000000000*) RANGE="HEAD~1..HEAD";; esac
          python scripts/check_traceability.py commits "$RANGE"
      - name: Traceability matrix points at real code and tests
        run: python scripts/check_traceability.py matrix
      - name: Skills are well-formed and owned; CLAUDE.md < 200 lines (Day 7)
        run: python scripts/check_skills.py

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: chatdocs, POSTGRES_PASSWORD: chatdocs, POSTGRES_DB: chatdocs_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chatdocs" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://chatdocs:chatdocs@localhost:5432/chatdocs_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e ".[dev,otel]"
      - name: Format + lint + complexity ≤ 10
        run: ruff check . && black --check .
      - name: Import rules DR-1 → DR-5
        run: lint-imports
      - name: Tests (unit + API + integration on PostgreSQL/pgvector), coverage ≥ 70 %
        run: pytest -q --cov --cov-report=term --cov-report=xml
      - name: Core modules coverage ≥ 90 % (domain, Q&A, retrieval)
        run: >-
          coverage report --fail-under=90
          --include="chatdocs/domain/*,chatdocs/application/qa_service.py,chatdocs/application/retrieval_service.py"
      - name: Evaluation harness tests
        working-directory: .
        run: python -m pytest -q eval
      - name: Dependency audit (T-EN09.5 — fails on known vulnerabilities)
        run: pip-audit --skip-editable
      - name: SBOM (CycloneDX)
        run: mkdir -p ../sbom && cyclonedx-py environment --output-format JSON -o ../sbom/backend.cdx.json
      - uses: actions/upload-artifact@v4
        with: { name: backend-evidence, path: "backend/coverage.xml\nsbom/" }

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - name: Lint (0 warnings) + prettier + complexity ≤ 10
        run: npm run lint
      - run: npm run typecheck
      - name: Tests, coverage ≥ 70 %
        run: npm run test:coverage
      - name: Build (reproducible from the lockfile)
        run: npm run build
      - name: Dependency audit (T-EN09.5 — high / critical block the merge)
        run: npm audit --omit=dev --audit-level=high
      - name: SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx --omit dev > web-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with: { name: web-build, path: "web/dist\nweb/coverage/lcov.info\nweb/web-sbom.cdx.json" }

  quality:
    # duplication < 3 % (Day 5 "Đo chất lượng")
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Duplication (jscpd) < 3 %
        run: >-
          npx --yes jscpd@4.0.5 backend/chatdocs web/src
          --ignore "**/*.test.*,**/test/**" --threshold 3 --reporters consoleFull

  image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t chatdocs-backend:ci backend
      - name: Trivy (T-EN09.5)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: chatdocs-backend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  e2e:
    # T-EN12.1: whole stack (Keycloak test realm, MinIO, pgvector, TEI, fake LLM) + Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [backend, frontend]
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'e2e')
    env: { LLM_PROVIDER: fake, E2E_LLM: fake, E2E_EVALUATION: "1", E2E_STACK: compose }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pymupdf && python eval/datasets/sample/build_docs.py
      - run: docker compose -f infra/docker-compose.yml up -d --build
      - name: Wait for the API
        run: for i in $(seq 1 120); do curl -fs http://localhost:8000/readyz && break; sleep 5; done
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - working-directory: e2e
        run: npm install && npx playwright install --with-deps chromium chrome msedge
      - working-directory: e2e
        run: npx playwright test
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: e2e/playwright-report }
      - if: always()
        run: docker compose -f infra/docker-compose.yml logs api worker > compose.log && docker compose -f infra/docker-compose.yml down -v

  e2e-local:
    # Day 6 L4: the 22 automated test cases of docs/test-cases.md (US-201, US-303) on the local test app
    # (backend/tests/e2e_server.py — real FastAPI + PyMuPDF, in-memory stores, scripted fake LLM). No Docker.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    env: { E2E_PYTHON: python, E2E_RUN: ci }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - working-directory: backend
        run: pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Test cases TC-201-01 … TC-303-10 (retries 0)
        working-directory: e2e
        run: npm run test:tc
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-case-evidence
          path: |
            reports/
            e2e/playwright-report/
            e2e/test-results/

  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
