# Mutation testing of the core modules (Day 5: mutation score ≥ 60 %; ADR-19). Weekly, because it is slow.
name: Mutation testing

on:
  schedule:
    - cron: "0 20 * * 5" # Saturday 03:00 Asia/Ho_Chi_Minh
  workflow_dispatch:

jobs:
  mutmut:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e ".[dev]"
      - name: Run mutants (paths and runner in backend/setup.cfg)
        run: mutmut run --no-progress || true # survivors make mutmut exit ≠ 0; the score below is the gate
      - run: mutmut junitxml > mutmut.xml
      - name: Score ≥ 60 %
        run: python ../scripts/mutation_score.py mutmut.xml 60
      - if: always()
        run: mutmut results > mutmut-survivors.txt || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: mutation-report, path: "backend/mutmut.xml\nbackend/mutmut-survivors.txt" }
