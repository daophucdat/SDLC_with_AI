# Dev environment (EN-02): `docker compose -f infra/docker-compose.yml up --build`
# SPA http://localhost:5173 (Vite proxies /api and /auth to the API) · Keycloak http://localhost:8080 (admin/admin)
# MinIO console http://localhost:9001 (chatdocs/chatdocs-secret) · Test users: see infra/keycloak/realm-chatdocs.json
name: chatdocs

x-backend-env: &backend-env
  ENVIRONMENT: dev
  APP_SECRET: dev-only-change-me-0123456789
  COOKIE_SECURE: "false"            # plain http on localhost; staging/prod use HTTPS and __Host- cookies
  DATABASE_URL: postgresql+asyncpg://chatdocs:chatdocs@postgres:5432/chatdocs
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: chat-docs
  S3_ACCESS_KEY: chatdocs
  S3_SECRET_KEY: chatdocs-secret
  S3_SSE: AES256
  OIDC_ISSUER: http://localhost:8080/realms/chatdocs      # public: browser redirect + expected `iss`
  OIDC_INTERNAL_BASE_URL: http://keycloak:8080            # server-to-server (discovery, token, JWKS)
  OIDC_CLIENT_ID: chatdocs
  OIDC_CLIENT_SECRET: chatdocs-dev-secret
  OIDC_REDIRECT_URI: http://localhost:5173/auth/callback
  EMBEDDER_URL: http://embedder:80
  ANALYTICS_HMAC_KEY: dev-only-analytics-key-0123
  # EN-06: "fake" answers from the retrieved chunks, no API key needed. For the real model set
  # LLM_PROVIDER=anthropic and LLM_API_KEY (from the secrets manager, never committed).
  LLM_PROVIDER: ${LLM_PROVIDER:-fake}
  LLM_API_KEY: ${LLM_API_KEY:-}
  FEATURE_FLAGS: ${FEATURE_FLAGS:-history,duplicate,stream_render,followup,evaluation}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chatdocs
      POSTGRES_PASSWORD: chatdocs
      POSTGRES_DB: chatdocs
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatdocs"]
      interval: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: chatdocs
      MINIO_ROOT_PASSWORD: chatdocs-secret
      MINIO_KMS_SECRET_KEY: chatdocs-key:bXltaW5pb2VuY3J5cHRpb25rZXljaGFuZ2VtZTEyMzQ1Njc4OTA=   # enables SSE-S3 locally
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2024-06-12T14-34-03Z
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 chatdocs chatdocs-secret &&
             mc mb --ignore-existing local/chat-docs &&
             mc anonymous set none local/chat-docs &&
             mc version enable local/chat-docs"

  embedder:
    # BGE-M3 on CPU (ADR-08). First start downloads the model (~2.3 GB) into the volume.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    command: --model-id BAAI/bge-m3 --max-batch-tokens 16384
    ports: ["8081:80"]
    volumes: [hfcache:/data]

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    # Fixed public hostname: tokens carry iss=http://localhost:8080/… whether the request came from the browser
    # or from the API over the compose network (backchannel).
    command: start-dev --import-realm --hostname=http://localhost:8080 --hostname-backchannel-dynamic=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]
    volumes: ["./keycloak/realm-chatdocs.json:/opt/keycloak/data/import/realm-chatdocs.json:ro"]

  api:
    build: { context: ../backend }
    command: sh -c "alembic upgrade head && uvicorn chatdocs.adapters.http.main:app --host 0.0.0.0 --port 8000"
    environment: *backend-env
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  worker:
    build: { context: ../backend }
    command: python -m chatdocs.adapters.jobs.worker_main
    environment: *backend-env
    expose: ["9101"]  # Prometheus metrics of the worker (infra/observability)
    depends_on:
      api: { condition: service_started }   # api runs the migrations
    # Network policy (EN-04 T-EN04.8): in staging/prod the worker has no route to the internet.

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://api:8000
    ports: ["5173:5173"]
    volumes: ["../web:/app", "/app/node_modules"]
    depends_on: [api]

volumes:
  pgdata:
  minio:
  hfcache:
