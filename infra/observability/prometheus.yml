# EN-07 T-EN07.2 / T-EN07.4. /metrics is scraped on the internal network only (the reverse proxy does not route it).
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files: [/etc/prometheus/alerts.yml]

alerting:
  alertmanagers: [{ static_configs: [{ targets: ["alertmanager:9093"] }] }]

scrape_configs:
  - job_name: chatdocs-api
    static_configs: [{ targets: ["api:8000"] }]

  - job_name: chatdocs-worker
    # the worker exposes the same registry through a tiny HTTP server (WORKER_METRICS_PORT, default 9101)
    static_configs: [{ targets: ["worker:9101"] }]

  - job_name: chatdocs-probe
    # LG-17: synthetic check of the public URL every minute (the business-hours window is in the alert rule)
    scrape_interval: 60s
    metrics_path: /probe
    params: { module: [http_2xx] }
    # dev target; staging / prod: the public URL https://chat-tai-lieu.congty.vn/login, probed from OUTSIDE the
    # cluster (Prometheus does not expand env vars here — the deploy pipeline renders this file per environment)
    static_configs: [{ targets: ["http://web:5173/login"] }]
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: "blackbox:9115" }
