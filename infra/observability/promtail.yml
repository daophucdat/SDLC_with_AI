# Ships the JSON logs of the api / worker containers to Loki (logs are already content-redacted by structlog).
server: { http_listen_port: 9080 }
clients: [{ url: http://loki:3100/loki/api/v1/push }]
scrape_configs:
  - job_name: docker
    docker_sd_configs: [{ host: unix:///var/run/docker.sock }]
    relabel_configs:
      - { source_labels: [__meta_docker_container_label_com_docker_compose_service], regex: "api|worker", action: keep }
      - { source_labels: [__meta_docker_container_label_com_docker_compose_service], target_label: service }
    pipeline_stages:
      - json: { expressions: { level: level, trace_id: trace_id } }
      - labels: { level: "" }
