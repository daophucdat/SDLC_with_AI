# Reverse proxy / LB in front of the SPA and the API (SAD §2.0, EN-02 T-EN02.3). Staging / prod.
upstream chatdocs_api { server api-1:8000; server api-2:8000; keepalive 32; }

# EN-09 T-EN09.3: coarse per-IP limit in front of all replicas (the API also limits per user)
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ask:10m rate=30r/m;

server {
  listen 443 ssl http2;
  server_name chat-tai-lieu.congty.vn;
  ssl_certificate     /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;                # SEC-02 (TLS 1.3 preferred, 1.2 allowed)
  # EN-09 T-EN09.2. nginx drops inherited add_header in any location that sets its own, hence the include.
  include /etc/nginx/snippets/chatdocs-security-headers.conf;

  client_max_body_size 55m;                      # 50 MB PDF + multipart overhead (US-201); app enforces 50 MB

  location /api/v1/conversations/ {              # SSE answers: no buffering, long reads
    limit_req zone=ask burst=10 nodelay;
    proxy_pass http://chatdocs_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location ~ ^/(api|auth)/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://chatdocs_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_request_buffering off;                 # stream uploads straight to the API
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location ~ ^/(healthz|readyz)$ { proxy_pass http://chatdocs_api; }
  location = /metrics { return 404; }            # Prometheus scrapes the API on the internal network only

  root /usr/share/nginx/html;                    # built SPA (web/dist)
  location /assets/ {
    include /etc/nginx/snippets/chatdocs-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location / {
    include /etc/nginx/snippets/chatdocs-security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
