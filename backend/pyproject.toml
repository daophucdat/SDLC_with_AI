[project]
name = "chatdocs"
version = "0.1.0"
description = "Chat với tài liệu (MVP) — backend API and worker"
requires-python = ">=3.10"   # production image runs 3.12; code stays 3.10-compatible
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "structlog>=24.1",
  "sqlalchemy[asyncio]>=2.0.29",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "authlib>=1.3",
  "boto3>=1.34",
  "pymupdf>=1.24",
  "anthropic>=2.2,<3",
  "prometheus-client>=0.20",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
otel = [
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
]
eval = ["pyyaml>=6"]
dev = [
  "pyyaml>=6",
  "pip-audit>=2.7",
  "pytest-cov>=5",
  "cyclonedx-bom>=4",
  "mutmut>=2.4,<3",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "black>=24.3",
  "import-linter>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chatdocs*"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "C901"]
ignore = ["S101", "B008", "UP007", "S608"]   # assert in tests; FastAPI Depends defaults; X | None; SQL is parameterised text()

[tool.ruff.lint.mccabe]
max-complexity = 10  # Day 5 L0 gate: cyclomatic complexity ≤ 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "ASYNC230"]  # fakes read small temp files
"migrations/versions/**" = ["E501"]  # SQL generated from dev_tasks.md §0.3

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs PostgreSQL+pgvector (TEST_DATABASE_URL); runs in CI"]

# ---------- coverage gate (Day 5 L0: ≥ 70 % overall; core modules checked separately in CI) ----------
[tool.coverage.run]
source = ["chatdocs"]
branch = true

[tool.coverage.report]
fail_under = 70
skip_covered = true
show_missing = true

# ---------- import rules DR-1 → DR-5 (Blueprint §3.3) ----------
[tool.importlinter]
root_package = "chatdocs"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "DR-1 layers: adapters -> application -> ports -> domain"
type = "layers"
layers = ["chatdocs.adapters", "chatdocs.application", "chatdocs.ports", "chatdocs.domain"]

[[tool.importlinter.contracts]]
name = "DR-1 domain depends on nothing else in the project"
type = "forbidden"
source_modules = ["chatdocs.domain"]
forbidden_modules = ["chatdocs.ports", "chatdocs.application", "chatdocs.adapters", "chatdocs.platform"]

[[tool.importlinter.contracts]]
name = "DR-1 domain and application stay framework-free"
type = "forbidden"
source_modules = ["chatdocs.domain", "chatdocs.application", "chatdocs.ports"]
forbidden_modules = ["fastapi", "sqlalchemy", "asyncpg", "boto3", "httpx", "authlib", "fitz", "pymupdf", "starlette"]

[[tool.importlinter.contracts]]
name = "DR-5 only adapters may import external service SDKs"
type = "forbidden"
source_modules = ["chatdocs.domain", "chatdocs.application", "chatdocs.ports", "chatdocs.platform"]
forbidden_modules = ["anthropic", "openai", "boto3", "fitz"]
