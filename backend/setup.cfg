# mutmut 2.x reads its settings from setup.cfg (everything else lives in pyproject.toml).
# Mutation testing (Day 5: mutation score ≥ 60 % on core modules) — weekly job .github/workflows/mutation.yml
[mutmut]
paths_to_mutate=chatdocs/domain/qa/citation_policy.py,chatdocs/domain/retrieval/rrf.py,chatdocs/domain/qa/question.py
tests_dir=tests/unit
runner=python -m pytest -x -q -p no:cacheprovider tests/unit/test_qa_domain.py tests/unit/test_retrieval.py tests/unit/test_core_contracts.py
